[project]
name = "jobs-pipeline"
version = "0.1.0"
description = "ELT pipeline that loads job postings into PostgreSQL and models them in 3NF"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.0",
    "pandera>=0.35.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

# "I" (isort) and ruff format are excluded on purpose: STYLES.MD §4.2 orders imports by length (D-08).
[tool.ruff.lint]
select = ["E", "F", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs a running PostgreSQL (deselect with -m 'not integration')"]
